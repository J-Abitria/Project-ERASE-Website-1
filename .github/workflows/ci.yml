name: GitHub CI

# Defines the triggers on the workflow:
on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Manual triggers.

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./code/ERASEwebsite
  
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          cache: 'pip'
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
      
      - name: Run Linter (Flake8)
        run: |
          pip install Flake8
          # stop the build if there are Python syntax errors/undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127
      
      - name: Run Django System Checks
        run: python manage.py check
      
      - name: Check for Missing Migrations
        run: python manage.py makemigrations --check --dry-run
      
      - name: Run Migrations
        run: python manage.py migrate

      - name: Run Tests
        run: python manage.py test

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    # Runs on direct pushes to main, merged PRs to main (which trigger a push event to main), or manual workflow dispatch
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify DATABASE_URL scheme
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          database_url = os.environ.get('DATABASE_URL', '').strip()
          scheme = urlsplit(database_url).scheme
          print(f'DATABASE_URL scheme: {scheme or "<missing>"}')
          if scheme not in {'postgres', 'postgresql'}:
              raise SystemExit('Set the DATABASE_URL GitHub Actions secret to a PostgreSQL URL.')
          PY

      - name: Build Project Artifacts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
